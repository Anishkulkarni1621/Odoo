<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume</title><link rel="stylesheet" href="../css/portal.css"></head><body><main class="portal"><header class="portal-header"><div><span class="eyebrow">Employee workspace</span><h1>Resume</h1><p>Keep your professional summary and interests up to date.</p></div></header><section class="card"><form id="resumeForm" data-endpoint="/api/profile" data-method="PATCH"><label>About me</label><textarea name="about" rows="6" placeholder="Tell your team about your experience..."></textarea><div class="grid"><div><label>Skills</label><input name="skills" placeholder="e.g. PostgreSQL, Flask"></div><div><label>Certifications</label><input name="certifications" placeholder="Certification name"></div></div><label>Interests</label><input name="interests" placeholder="What do you enjoy working on?"><div class="form-actions"><button class="button" type="submit">Save resume</button></div><p class="status"></p></form></section></main><script src="../js/portal.js"></script><script src="../js/module.js"></script></body></html>
