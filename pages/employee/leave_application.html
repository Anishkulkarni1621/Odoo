<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Application</title><link rel="stylesheet" href="../css/portal.css"></head><body><main class="portal"><header><span class="eyebrow">Employee portal</span><h1>Leave Application</h1><p>Request paid, sick, or unpaid leave.</p></header><section class="card"><form id="leaveForm" data-endpoint="/api/leaves"><div class="grid"><div><label>Leave type</label><select name="leave_type"><option value="paid">Paid leave</option><option value="sick">Sick leave</option><option value="unpaid">Unpaid leave</option></select></div><div><label>Start date</label><input name="start_date" type="date" required></div><div><label>End date</label><input name="end_date" type="date" required></div><div><label>Attachment</label><input name="attachment" type="file"></div></div><label>Reason</label><textarea name="remarks"></textarea><button type="submit">Submit request</button><p class="status"></p></form></section><section class="card"><h2>My leave history</h2><p>Approved, rejected, and pending requests load from PostgreSQL.</p></section></main><script src="../js/portal.js"></script><script src="../js/module.js"></script></body></html>
