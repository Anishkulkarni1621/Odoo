<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update password · Dayflow HRMS</title><link rel="stylesheet" href="../css/portal.css"></head>
<body><main class="portal"><header class="portal-header"><div><span class="eyebrow">Account security</span><h1>Update password</h1><p>Protect your account with a strong password. Passwords are securely hashed before storage.</p></div><a class="button secondary" href="emp_dashboard.html">Back to dashboard</a></header>
<section class="card security-card"><div class="security-heading"><span class="security-icon">⌘</span><div><h2>Change your password</h2><p>Use your current password to create a new one.</p></div></div><form id="passwordForm" class="security-form"><label for="currentPassword">Current password</label><div class="password-field"><input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"><button type="button" data-toggle-password="currentPassword">Show</button></div><label for="newPassword">New password</label><div class="password-field"><input id="newPassword" name="newPassword" type="password" minlength="8" required autocomplete="new-password"><button type="button" data-toggle-password="newPassword">Show</button></div><div id="passwordStrength" class="password-strength"><span></span><span></span><span></span><small>Use at least 8 characters with a mix of letters, numbers, and symbols.</small></div><label for="confirmPassword">Confirm new password</label><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><button type="button" data-toggle-password="confirmPassword">Show</button></div><div class="form-actions"><a class="button secondary" href="emp_dashboard.html">Cancel</a><button type="submit">Update password</button></div><p id="passwordMessage" class="status" role="alert" aria-live="polite"></p></form></section></main><script src="../js/portal.js"></script></body></html>
