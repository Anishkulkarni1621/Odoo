<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — HRM System</title>
<style>
  :root{
    --bg-top:#F7F6FC;
    --bg-bottom:#EFEDF9;
    --card-bg:#FFFFFF;
    --primary:#7C3AED;
    --primary-hover:#6D28D9;
    --primary-tint:#F3EEFE;
    --text-primary:#1E1B2E;
    --text-secondary:#6B7280;
    --border:#E3E1EC;
    --input-bg:#FBFAFE;
    --focus-ring:rgba(124,58,237,0.15);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    color:var(--text-primary);
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--card-bg);
    border-radius:16px;
    padding:36px 32px 32px;
    box-shadow:0 4px 24px rgba(30,27,46,0.06), 0 1px 3px rgba(30,27,46,0.05);
    border:1px solid var(--border);
  }

  .logo-frame{
    width:110px;
    height:56px;
    margin:0 auto 22px;
    border:1.5px dashed #C9C6DC;
    border-radius:10px;
    background:#FAF9FD;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-frame span{
    font-size:12px;
    font-weight:bold;
    letter-spacing:1.5px;
    color:#9C98B4;
  }

  .brand{
    text-align:center;
    font-size:12px;
    letter-spacing:0.5px;
    color:var(--text-secondary);
    margin-bottom:6px;
    text-transform:uppercase;
  }

  h1{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:6px;
  }

  .subtitle{
    text-align:center;
    font-size:13px;
    color:var(--text-secondary);
    margin-bottom:28px;
  }

  form{display:flex;flex-direction:column;}

  .field{
    margin-bottom:18px;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--text-primary);
    margin-bottom:7px;
  }

  .input-frame{
    position:relative;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--input-bg);
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-frame:focus-within{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--focus-ring);
    background:#FFFFFF;
  }

  .input-frame input{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    font-family:Arial, Helvetica, sans-serif;
    font-size:14px;
    color:var(--text-primary);
    padding:12px 14px;
  }

  .input-frame input::placeholder{
    color:#B4B1C6;
  }

  .input-frame.has-toggle input{
    padding-right:42px;
  }

  .toggle-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    border:none;
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    color:#9C98B4;
  }

  .toggle-btn:hover{
    background:var(--primary-tint);
    color:var(--primary);
  }

  .toggle-btn svg{width:18px;height:18px;}

  .submit-btn{
    margin-top:6px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:#FFFFFF;
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:background 0.15s ease;
  }

  .submit-btn:hover{
    background:var(--primary-hover);
  }

  .switch-text{
    margin-top:22px;
    text-align:center;
    font-size:13px;
    color:var(--text-secondary);
  }

  .switch-text a{
    color:var(--primary);
    font-weight:bold;
    text-decoration:none;
  }

  .switch-text a:hover{
    text-decoration:underline;
  }

  input:focus-visible, .toggle-btn:focus-visible, .submit-btn:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
  }

  @media (max-width:420px){
    .card{padding:28px 20px 24px;}
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo-frame"><span>LOGO</span></div>
    <div class="brand">Human Resource Management System</div>
    <h1>Sign In</h1>
    <p class="subtitle">Enter your credentials to access your account</p>

    <form onsubmit="return false;">
      <div class="field">
        <label for="loginId">Login ID / Email</label>
        <div class="input-frame">
          <input type="text" id="loginId" name="loginId" placeholder="Enter your Login ID or Email" autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-frame has-toggle">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-btn" aria-label="Show password" onclick="togglePassword('password', this)">
            <svg id="password-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>

      <p class="switch-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </form>
  </div>

<script>
  function togglePassword(id, btn){
    const input = document.getElementById(id);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    const icon = btn.querySelector('svg');
    icon.innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.9 18.9 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.9 18.9 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
</script>

</body>
</html>
