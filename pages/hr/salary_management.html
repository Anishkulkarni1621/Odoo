<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Management</title><link rel="stylesheet" href="../css/portal.css"></head><body><main class="portal"><header><span class="eyebrow">HR/Admin</span><h1>Salary Management</h1><p>Configure wage types, salary components, deductions, and tax rules.</p></header><section class="card"><form data-endpoint="/api/salary/components"><div class="grid"><div><label>Component name</label><input name="component_name" required></div><div><label>Component code</label><input name="component_code" required></div><div><label>Calculation type</label><select name="calculation_type"><option value="fixed">Fixed</option><option value="percentage">Percentage</option></select></div><div><label>Percentage of</label><input name="percentage_of"></div></div><button type="submit">Save component</button><p class="status"></p></form></section><section class="card"><h2>Salary structures</h2><p>Structures and employee assignments load from the database.</p></section></main><script src="../js/portal.js"></script><script src="../js/module.js"></script></body></html>
