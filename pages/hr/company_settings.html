<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Settings</title><link rel="stylesheet" href="../css/portal.css"></head><body><main class="portal"><header class="portal-header"><div><span class="eyebrow">HR/Admin workspace</span><h1>Company settings</h1><p>Manage company identity, logo, contact details, and working defaults.</p></div></header><section class="card company-settings-card"><div class="form-intro"><span class="form-icon">◆</span><div><h2>Company identity</h2><p>Your logo appears in the signed-in workspace for HR and employees.</p></div></div><form id="companySettingsForm" data-endpoint="/api/company" enctype="multipart/form-data"><div class="logo-upload-row"><div id="companyLogoPreview" class="company-logo-preview">LOGO</div><div><label for="company_logo">Company logo</label><input id="company_logo" name="company_logo" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml"><p class="field-help">PNG, JPG, GIF, WEBP, or SVG · maximum 4 MB</p></div></div><div class="grid"><div><label>Company name</label><input name="company_name" required></div><div><label>Company email</label><input name="email" type="email"></div><div><label>Phone</label><input name="phone"></div><div><label>Country</label><input name="country"></div></div><label>Address</label><textarea name="address_line1"></textarea><div class="form-actions"><button type="submit">Save company settings</button></div><p class="status"></p></form></section></main><script src="../js/portal.js"></script><script src="../js/module.js"></script></body></html>
