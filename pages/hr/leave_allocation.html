<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leave Allocation</title><link rel="stylesheet" href="../css/portal.css"></head><body><main class="portal"><header><span class="eyebrow">HR/Admin</span><h1>Leave Allocation</h1><p>Assign paid, sick, and unpaid leave balances.</p></header><section class="card"><form data-endpoint="/api/leave-balances"><div class="grid"><div><label>Employee ID</label><input name="employee_id" type="number" required></div><div><label>Leave type</label><select name="leave_type"><option value="paid">Paid</option><option value="sick">Sick</option><option value="unpaid">Unpaid</option></select></div><div><label>Calendar year</label><input name="calendar_year" type="number" required></div><div><label>Allocated days</label><input name="allocated_days" type="number" step="0.5" required></div></div><button type="submit">Save allocation</button><p class="status"></p></form></section></main><script src="../js/portal.js"></script><script src="../js/module.js"></script></body></html>
